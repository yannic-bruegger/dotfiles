# Pomodoro timer config for uair — https://github.com/metent/uair
#
# The daemon is kept alive by ~/.config/uair/uair-bar.sh (launched by the
# Waybar `custom/uair` module) and streams the remaining time once per second.
# Control it with `uairctl`:
#   uairctl toggle     # start / pause
#   uairctl next|prev  # switch session
#   uairctl jump work  # jump to a session by id
#
# uair exits once the last session finishes; the wrapper then respawns it, so
# after a break the timer shows the focus session again (paused, 25:00).

[defaults]
# {time} = remaining time. Kept plain so Waybar can wrap it in parentheses
# symmetrically, e.g. (24:59).
format = "{time}\n"

[[sessions]]
id = "work"
name = "Fokus"
duration = "25m"
# Focus finished → notify and auto-start the break.
command = "notify-send -u critical '🍅 Fokus vorbei' 'Zeit für eine Pause!' && uairctl jump rest && uairctl resume"

[[sessions]]
id = "rest"
name = "Pause"
duration = "5m"
# Break finished → notify. uair then exits and the wrapper respawns it back
# on the focus session (paused), ready for the next round.
command = "notify-send -u critical '☕ Pause vorbei' 'Weiter geht’s!'"
